const measDesc=meas.map(([k,l])=>({k,l:RL[k]||l,get:c=>{

    const cfg=[[8,16,34,-6,24],[24,22,28,-17,-30],[41,14,38,-30,28],[58,20,31,-11,-22],[74,17,36,-24,30],[90,24,27,-3,-26]];
    box.innerHTML=cfg.map(([l,w,du,de,dx])=>'<i class="lan lt" style="left:'+l+'%;width:'+w+'px;height:'+Math.round(w*1.3)+'px;--dx:'+dx+'px;animation-duration:'+du+'s;animation-delay:'+de+'s"></i>').join('');
  }
  let timer=0;
  function release(){
    const old=document.getElementById('lkburst');if(old)old.remove();clearTimeout(timer);
    const o=document.createElement('div');o.id='lkburst';o.setAttribute('aria-hidden','true');
    const glow=document.createElement('div');glow.className='lkglow';o.appendChild(glow);
    document.body.appendChild(o);
    const W=window.innerWidth,H=window.innerHeight,N=18;
    let end=0;
    for(let i=0;i<N;i++){
      const w=22+Math.random()*26,h=Math.round(w*1.3);
      const x=((i+.5)/N)*W+(Math.random()-.5)*(W/N);
      const dur=1400+Math.random()*300,del=Math.random()*300;
      const dx=(Math.random()-.5)*W*.2,rise=H*(.9+Math.random()*.3)+h+70;
      end=Math.max(end,dur+del);
      const b=document.createElement('i');b.className='lan lb';
      b.style.cssText='left:'+x+'px;width:'+w+'px;height:'+h+'px';
      o.appendChild(b);
      b.animate([
        {transform:'translate(0px,0px) scale(.6)',opacity:0,offset:0},
        {opacity:1,offset:.14},
        {transform:'translate('+dx*.5+'px,'+(-rise*.5)+'px) scale(.9)',opacity:1,offset:.6},
        {transform:'translate('+dx+'px,'+(-rise)+'px) scale(1.1)',opacity:0,offset:1}
      ],{duration:dur,delay:del,easing:'cubic-bezier(.3,.1,.5,1)',fill:'both'});
    }
    glow.animate([{opacity:1,offset:0},{opacity:.8,offset:.3},{opacity:0,offset:1}],{duration:Math.min(end,1300),easing:'ease-out',fill:'both'});
    timer=setTimeout(()=>{o.remove()},end+100);
  }
  window.lkRelease=release;
  const h=document.querySelector('.top h1');if(h)h.addEventListener('click',release);
  release();
})();
/* ---------- V03.2: easier filling ---------- */
(function(){
  const q=(sel)=>document.querySelector(sel);
  const pick=(k,v,focus)=>{setK(k,v);V[k]=v.trim();render();if(focus){const el=q(`[data-k="${k}"]`);if(el){el.focus();try{el.setSelectionRange(v.length,v.length)}catch(e){}}}};
  function chips(after,vals,fn,label){
    const d=document.createElement('div');d.className='qk';
    if(label){const l=document.createElement('span');l.className='qkl';l.textContent=label;d.appendChild(l)}
    vals.forEach(([label,val])=>{const b=document.createElement('button');b.type='button';b.textContent=label;
      b.onmousedown=e=>e.preventDefault();b.onclick=()=>fn(val===undefined?label:val);d.appendChild(b)});
    after.after(d);return d;
  }
  // Present rhythm: tap a pattern, then type the rate
  const rh=q('[data-k="rhythm"]');
  if(rh)chips(rh,[['As-Vs'],['As-Vp'],['Ap-Vs'],['Ap-Vp'],['AF-Vp'],['AF-Vs']],v=>pick('rhythm',v+' ',true));
  // Mode
  const md=q('[data-k="mode"]');
  if(md){const cell=md.closest('.g>div'),at=(cell&&cell.nextElementSibling)||md;
    chips(at,[['DDD'],['DDDR'],['AAI<=>DDD'],['AAIR<=>DDDR'],['VVI'],['VVIR'],['DDI'],['DDIR']],v=>pick('mode',v),'Mode').classList.add('full')}
  // Next follow up: 3 / 6 / 12 months
  const nf=q('#nfDate');
  if(nf){
    const seg=nf.previousElementSibling;
    chips(seg,[['3 mo',3],['6 mo',6],['1 yr',12]],n=>{
      if(V.nfmode==='Month'){V.nfunit=V.nfunit||'months';pick('nfmon',String(n))}
      else{const b=V.fu?new Date(V.fu+'T00:00'):new Date();const d=new Date(b.getFullYear(),b.getMonth()+n,b.getDate());
        if(d.getDate()!==b.getDate())d.setDate(0);
        pick('nextfu',d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'))}
    }).style.cssText='margin:0 0 10px';
    seg.style.marginBottom='8px';
  }
  // Show only the parts that fit the device type (never hide something already filled in)
  const sec=h=>[...document.querySelectorAll('section.sec')].find(x=>x.querySelector('h2')&&x.querySelector('h2').textContent.trim().startsWith(h));
  const lvSec=sec('LV Vector'),dzSec=sec('Detection zone');
  const defRow=q('[data-k="defib_A"]')&&q('[data-k="defib_A"]').closest('tr');
  const chg=q('[data-k="chgs"]')&&q('[data-k="chgs"]').closest('.row')&&q('[data-k="chgs"]').closest('.row').parentElement;
  const filled=sel=>[...document.querySelectorAll(sel)].some(i=>i.type==='checkbox'?i.checked:i.tagName==='SELECT'?i.selectedIndex>0:String(i.value||'').trim()!=='');
  const note=document.createElement('p');note.className='relnote';
  const devBox=q('#dev');if(devBox)devBox.after(note);
  function rel(){
    const t=V.dtype||'',known=['Pacemaker','ICD','CRT','CRT-D'].includes(t);
    const lv=t==='CRT'||t==='CRT-D',icd=t==='ICD'||t==='CRT-D';
    const hideLV=known&&!lv&&!filled('#tbl [data-k$="_LV"]');
    const hideIcd=known&&!icd;
    const tbl=q('#tbl');if(tbl)tbl.classList.toggle('noLV',hideLV);
    if(defRow)defRow.hidden=hideIcd&&!filled('[data-k^="defib"]');
    if(chg)chg.hidden=hideIcd&&!filled('[data-k="chgs"],[data-k="chgj"]');
    if(lvSec)lvSec.hidden=known&&!lv&&!filled('[data-k^="lvvec"],[data-k^="vv"]');
    if(dzSec)dzSec.hidden=hideIcd&&!filled('#dzs input');
    note.textContent=known?('Showing fields for '+t+'. '+(lv?'':'No LV. ')+(icd?'':'No shock / detection zones.')).trim():'';
    note.hidden=!known;
  }
  // while typing, hide the floating Export / Preview bar so it never covers buttons or fields
  const isField=el=>el&&(el.tagName==='TEXTAREA'||el.tagName==='SELECT'||(el.tagName==='INPUT'&&!['checkbox','radio','button'].includes(el.type)));
  document.addEventListener('focusin',e=>{if(isField(e.target))document.body.classList.add('typing')});
  document.addEventListener('focusout',()=>setTimeout(()=>{if(!isField(document.activeElement))document.body.classList.remove('typing')},150));
  document.addEventListener('click',()=>setTimeout(rel,0));
  document.addEventListener('input',()=>setTimeout(rel,0));
  document.addEventListener('change',()=>setTimeout(rel,0));
  rel();
})();

/* ---------- Auto-update (GitHub Pages / iPhone shortcut) + release notes ---------- */
(function(){
  const NK='fu_notes_seen';
  const lsGet=k=>{try{return localStorage.getItem(k)}catch(e){return null}};
  const lsSet=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
  const parseNotes=html=>{const m=/<script type="application\/json" id="relnotes">([\s\S]*?)<\/script>/.exec(html||'');if(!m)return null;try{return JSON.parse(m[1])}catch(e){return null}};
  const fmt=s=>esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');
  const DEMO={
    sticker:'<div class="paper"><div class="rtl">ใบรายงานผลการเช็คเครื่อง</div><div class="stk2"><div class="s1"><b>HN 00000000</b><i>Ward 1</i></div><div class="nm">ทดสอบ ตัวอย่าง</div><div class="hp">Test Hospital</div></div></div>',
    synth:'<div class="syn"><b>DEVICE FU</b><svg viewBox="0 0 300 34" preserveAspectRatio="none"><path class="e0" d="M0 23L15 23Q17.25 19 19.5 23L24 23L24 5L24.5 23L27 23L28.5 19L30 23L32 29L34.5 10L37 23Q44 29 51 23L60 23L75 23Q77.25 19 79.5 23L84 23L84 5L84.5 23L87 23L88.5 19L90 23L92 29L94.5 10L97 23Q104 29 111 23L120 23L135 23Q137.25 19 139.5 23L144 23L144 5L144.5 23L147 23L148.5 19L150 23L152 29L154.5 10L157 23Q164 29 171 23L180 23L195 23Q197.25 19 199.5 23L204 23L204 5L204.5 23L207 23L208.5 19L210 23L212 29L214.5 10L217 23Q224 29 231 23L240 23L255 23Q257.25 19 259.5 23L264 23L264 5L264.5 23L267 23L268.5 19L270 23L272 29L274.5 10L277 23Q284 29 291 23L300 23" pathLength="1000"/><path class="e1" d="M0 23L15 23Q17.25 19 19.5 23L24 23L24 5L24.5 23L27 23L28.5 19L30 23L32 29L34.5 10L37 23Q44 29 51 23L60 23L75 23Q77.25 19 79.5 23L84 23L84 5L84.5 23L87 23L88.5 19L90 23L92 29L94.5 10L97 23Q104 29 111 23L120 23L135 23Q137.25 19 139.5 23L144 23L144 5L144.5 23L147 23L148.5 19L150 23L152 29L154.5 10L157 23Q164 29 171 23L180 23L195 23Q197.25 19 199.5 23L204 23L204 5L204.5 23L207 23L208.5 19L210 23L212 29L214.5 10L217 23Q224 29 231 23L240 23L255 23Q257.25 19 259.5 23L264 23L264 5L264.5 23L267 23L268.5 19L270 23L272 29L274.5 10L277 23Q284 29 291 23L300 23" pathLength="1000"/></svg></div>',
    hex:'<div class="hexhd"><b>Device FU</b><i>V03.3</i><u></u></div>',
    chips:'<div class="pad seq"><div class="row" style="margin-bottom:6px"><span class="lab">Rhythm</span><span class="pill a">As-Vs</span><span class="pill b">As-Vp</span><span class="pill c">AF-Vp</span></div>'+
          '<div class="row" style="margin-bottom:6px"><span class="lab">Mode</span><span class="pill a d1">DDD</span><span class="pill b d1">DDDR</span><span class="pill c d1">VVIR</span></div>'+
          '<div class="row"><span class="lab">Next F/U</span><span class="pill a d2">3 mo</span><span class="pill b d2">6 mo</span><span class="pill c d2">1 yr</span></div></div>',
    special:'<div class="pad sp"><div class="box">Threshold A&nbsp;&nbsp;<span class="afv">AF</span><span class="caret"></span></div>'+
          '<div class="row pop"><span class="pill">&gt;8.0</span><span class="pill">Non capture</span><span class="pill">-</span><span class="pill afp">AF<span class="tap"></span></span></div></div>',
    lk:'<div class="lk"><b>15–25 Nov</b><span style="left:18%;animation-delay:-1s"></span><span style="left:34%;animation-delay:-3.2s"></span><span style="left:74%;animation-delay:-2.1s"></span><span style="left:88%;animation-delay:-4.4s"></span></div>'
  };
  const css='position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:50;max-width:480px;margin:0 auto;background:var(--card);color:var(--tx);border:2px solid var(--ac);border-radius:14px;padding:14px 16px;box-shadow:0 6px 24px rgba(0,0,0,.35);font-size:13px;line-height:1.4;max-height:min(78vh,620px);overflow-y:auto;-webkit-overflow-scrolling:touch';
  function card(title,notes,btns){
    const old=document.getElementById('upd');if(old)old.remove();
    const d=document.createElement('div');d.id='upd';d.setAttribute('role','dialog');d.style.cssText=css;
    const dm=(notes&&notes.demos)||[];
    const items=notes&&notes.items&&notes.items.length?'<ul style="margin:8px 0 12px;padding-left:20px">'+notes.items.map((s,i)=>'<li style="margin:3px 0">'+fmt(s)+(DEMO[dm[i]]?'<div class="rnd" aria-hidden="true">'+DEMO[dm[i]]+'</div>':'')+'</li>').join('')+'</ul>':'<div style="height:10px"></div>';
    d.innerHTML='<div style="font-weight:800;font-size:14.5px;color:var(--ac)">'+esc(title)+'</div>'+items+'<div style="display:flex;gap:8px"></div>';
    const row=d.lastChild;btns.forEach(([t,fn,p])=>{const b=document.createElement('button');b.type='button';b.textContent=t;b.style.flex='1';if(p)b.className='p';b.onclick=()=>{d.remove();fn&&fn()};row.appendChild(b)});
    document.body.appendChild(d);
  }
  // show "What's new" once after an update
  const mine=parseNotes(document.documentElement.outerHTML);
  // tap the version badge any time to see What's new again
  {const vb=document.getElementById('ver');if(vb&&mine){vb.setAttribute('role','button');vb.setAttribute('tabindex','0');vb.setAttribute('aria-label',"Show what's new");vb.style.cursor='pointer';
    const show=e=>{e.stopPropagation();e.preventDefault();card("What's new \u2014 "+(document.documentElement.dataset.ver||''),mine,[['Got it',null,1]])};
    vb.addEventListener('click',show);vb.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' ')show(e)})}}
  const myBuild=(document.querySelector('meta[name="fu-build"]')||{}).content||'';
  let justUpdated=false;try{justUpdated=!!myBuild&&sessionStorage.getItem('fu_try')===myBuild;if(justUpdated)sessionStorage.removeItem('fu_try')}catch(e){}
  if(justUpdated&&mine){lsSet(NK,mine.id);setTimeout(()=>card("Updated \u2014 "+(document.documentElement.dataset.ver||''),mine,[['Got it',null,1]]),700)}
  else if(mine&&mine.id&&lsGet(NK)!==mine.id){
    const seenBefore=lsGet(NK)!==null||lsGet('fu_page_hash')!==null;
    lsSet(NK,mine.id);
    if(seenBefore)setTimeout(()=>card("What's new — "+(document.documentElement.dataset.ver||''),mine,[['Got it',null,1]]),900);
  }
  if(!/^https?:$/.test(location.protocol))return;
  let busy=false,last=0;
  const K='fu_page_hash';
  const hash=s=>{let h=5381;for(let i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))|0;return(h>>>0).toString(36)+s.length.toString(36)};
  // Each release carries its own build number. Compare the build of THIS page with the one on the server,
  // so a stale copy kept by the iPhone home-screen icon always shows the update box (never silently stays old).
  const MYB=(document.querySelector('meta[name="fu-build"]')||{}).content||'';
  const bOf=t=>{const m=/<meta name="fu-build" content="([^"]+)"/.exec(t);return m?m[1]:''};
  const ssGet=k=>{try{return sessionStorage.getItem(k)}catch(e){return null}},ssSet=(k,v)=>{try{sessionStorage.setItem(k,v)}catch(e){}};
  let fresh='';
  const toast=t=>{let el=document.getElementById('fu_toast');if(!el){el=document.createElement('div');el.id='fu_toast';el.setAttribute('role','status');
    el.style.cssText='position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:99;background:var(--ac);color:var(--acx);padding:10px 18px;border-radius:999px;font-weight:700;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.25)';document.body.appendChild(el)}el.textContent=t};
  const go=(h,b)=>{lsSet(K,h);
    // tried reloading once already and the phone still gave us the old copy: show the new page directly
    if(b&&ssGet('fu_try')===b&&fresh){try{location.replace(URL.createObjectURL(new Blob([fresh],{type:'text/html'})));return}catch(e){}}
    if(b)ssSet('fu_try',b);
    const u=new URL(location.href);u.searchParams.set('v',(b||h)+'-'+Date.now().toString(36));location.replace(u.toString())};
  async function check(force){
    if(busy||(!force&&Date.now()-last<30000))return;busy=true;last=Date.now();
    try{
      const u=new URL(location.href);u.searchParams.delete('v');u.searchParams.set('_',Date.now());u.hash='';
      const r=await fetch(u.toString(),{cache:'no-store'});
      if(!r.ok)return;
      const txt=await r.text(),h=hash(txt),sb=bOf(txt),old=lsGet(K);
      if(sb&&MYB){
        if(sb===MYB){lsSet(K,h);return}            // this page is the newest
        fresh=txt;
        const n=+(ssGet('fu_n_'+sb)||0);
        if(n>=3){card('New version available',parseNotes(txt),[['Later',null],['Update',()=>go(h,sb),1]]);return}
        const run=()=>{ssSet('fu_n_'+sb,String(n+1));toast('Updating\u2026');setTimeout(()=>go(h,sb),600)};
        const typing=()=>{const a=document.activeElement;return a&&(a.tagName==='TEXTAREA'||a.tagName==='SELECT'||(a.tagName==='INPUT'&&!['checkbox','radio','button'].includes(a.type)))};
        if(!typing())run();
        else{const w=()=>setTimeout(()=>{if(typing())return;document.removeEventListener('focusout',w);run()},400);document.addEventListener('focusout',w)}
        return;
      }
      // server file without a build number: fall back to the old comparison
      if(!old){lsSet(K,h);return}
      if(old===h)return;
      fresh=txt;
      card('New version available',parseNotes(txt),[['Later',null],['Update',()=>go(h,''),1]]);
    }catch(e){}finally{busy=false}
  }
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')check()});
  window.addEventListener('pageshow',e=>{if(e.persisted)check()});
  setTimeout(()=>check(true),1500);
})();
