/* ---------- Halloween (auto: through 31 Oct 2026, or ?theme=halloween) ---------- */

.bat{position:absolute;left:0;will-change:transform;animation:batfly linear infinite}
.bat i{display:block;animation:batbob ease-in-out infinite alternate}

#burst{position:fixed;left:0;top:0;width:100%;height:100%;z-index:60;pointer-events:none;overflow:hidden}

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const RXN=6,RXT=['J','ATP'],ATP=['Burst','Ramp','Burst+','Ramp+'];

const seg=(k,opts)=>`<div class="seg">${opts.map(o=>`<button type="button" data-set="${k}" data-val="${o}">${o}</button>`).join('')}</div>`;
const rxTxt=(z,i)=>{const t=V[`dzt_${z}_${i}`]||'',a=V[`dza_${z}_${i}`]||'',v=V[`dzv_${z}_${i}`]||'';if(!t&&!v)return'';
  if(t==='J')return v?v+'J':'J';if(t==='ATP'){const n=a||'ATP';return v?`${n}(${v})`:n}return v};

const RL={pace:'Pacing(%)',sense:'Sensing(mV)',imp:'Impedance(Ω)',defib:'ICD Defib/SVC',thr:'Threshold(V)',thrms:'at(ms)',thr2:'Threshold 2(V)',thrms2:'at 2(ms)',amp:'Amplitude(V)',pw:'Pulse width(ms)',sens:'Sensitivity(mV)'};
const meas=[['pace','Pacing (%)'],['sense','Sensing (mV)'],['imp','Impedance (Ω)'],['defib','ICD Defib/SVC (Ω)'],['thr','Threshold (V)'],['thrms','at (ms)']];

const descRows=desc=>desc.map(d=>`<tr><td class="l">${d.l}</td>${C.map(c=>{const v=d.get(c),f=cellFs(v);return `<td${f?` style="font-size:${f}px;white-space:nowrap"`:''}>${v?esc(v):'-'}</td>`}).join('')}</tr>`).join('');

function unitWord(u,val){const n=parseFloat(String(val||'').replace(/[<>]/g,''));const isMonth=u==='Months';if(isMonth)return n===1?'month':'months';return n===1?'year':'years'}
const lvLine=t=>`<tr><td colspan="4" style="border:0;text-align:right;font-weight:400;font-size:10px;height:auto;padding:0 3px 1px 0;white-space:nowrap">${t}</td></tr>`;

}
const fld=([k,l,t,u,im])=>`<div${t==='full'?' class="full"':''}><label>${l}</label>${u?`<div class="ui"><input data-k="${k}"${im?` inputmode="${im}"`:''}><b>${u}</b></div>`:`<input data-k="${k}" type="${t&&t!=='full'?t:'text'}"${im?` inputmode="${im}"`:''}>`}</div>`;
$('#pt').innerHTML=pt.map(fld).join('');

$('#dzs').innerHTML=DZ.map(([z,n])=>`<div class="dzb"><label class="chip"><input type="checkbox" data-k="dz_${z}">${n}</label><div class="dzw" id="dzw_${z}">

${z==='VTM'?'':Array.from({length:RXN},(_,j)=>{const i=j+1;return `<div class="rx"><span class="rxn">RX${i}</span>${seg(`dzt_${z}_${i}`,RXT)}<div class="ui"><input data-k="dzv_${z}_${i}" inputmode="decimal"><b id="rxu_${z}_${i}"></b></div>
<div class="atp" id="atp_${z}_${i}">${seg(`dza_${z}_${i}`,ATP)}</div></div>`}).join('')+
`<div class="dzq"><button type="button" data-q40="${z}">40J × 6</button><button type="button" data-qfill="${z}">Fill RX2-6 same as RX1</button></div>`}
</div></div>`).join('');
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
  if(b.dataset.set){const k=b.dataset.set;V[k]=V[k]===b.dataset.val?'':b.dataset.val;render();return}
  if(b.dataset.q40){const z=b.dataset.q40;for(let i=1;i<=RXN;i++){V[`dzt_${z}_${i}`]='J';V[`dza_${z}_${i}`]='';setK(`dzv_${z}_${i}`,'40')}render();return}
  if(b.dataset.qfill){const z=b.dataset.qfill;for(let i=2;i<=RXN;i++){V[`dzt_${z}_${i}`]=V[`dzt_${z}_1`]||'';V[`dza_${z}_${i}`]=V[`dza_${z}_1`]||'';setK(`dzv_${z}_${i}`,V[`dzv_${z}_1`]||'')}render();return}
});
const row=(([k,l],cls)=>`<tr${cls?` class="${cls}"`:''}><td>${l}</td>${C.map(c=>`<td>${k==='defib'&&c==='RV'?'<div style="display:flex;gap:2px"><input data-k="defib_RV" inputmode="decimal"><input data-k="defib2_RV" inputmode="decimal"></div>':`<input data-k="${k}_${c}" inputmode="${k==='sense'?'text':'decimal'}"${k==='sense'?' enterkeyhint="next" autocapitalize="off" autocomplete="off"':''}>`}</td>`).join('')}</tr>`);
const mainRows=meas.map(m=>row(m)+(m[0]==='thrms'?meas2.map(m2=>row(m2,'x2')).join(''):'')).join('');
$('#tbl').innerHTML=`<tr><th></th>${C.map(c=>`<th>${c}</th>`).join('')}</tr>`+mainRows+`<tr class="sub"><td colspan="4">Setting</td></tr>`+set.map(m=>row(m)).join('');
const fd=v=>{if(!v)return'';const d=new Date(v);return isNaN(d)?v:d.toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'})};
const dl=(items)=>items.filter(([k])=>V[k]).map(([k,l,t])=>`<dt>${l}</dt><dd>${esc(t?fd(V[k]):V[k])}</dd>`).join('');
function tbl(list){
  const cs=C.filter(c=>list.some(([k])=>V[k+'_'+c]));
  if(!cs.length)return'';
  return `<table><tr><th></th>${cs.map(c=>`<th>${c}</th>`).join('')}</tr>`+
   list.filter(([k])=>cs.some(c=>V[k+'_'+c])).map(([k,l])=>`<tr><td>${l}</td>${cs.map(c=>`<td>${esc(V[k+'_'+c])||'-'}</td>`).join('')}</tr>`).join('')+`</table>`;
}
const DOC_CSS='.doc{font:12px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue","Sukhumvit Set",Thonburi,Sarabun,"Noto Sans Thai",system-ui,sans-serif;color:#1e3a8a;background:#fff;width:300px;max-width:100%;margin:0 auto}.doc .pt{font-size:11px;color:#111;display:flex;flex-direction:column;gap:1px;margin:0 0 5px 4px}.doc .rt{font-weight:700;font-size:13px;color:#111;text-align:center;margin:0 0 6px}.doc .rh{font-weight:700;color:#111;margin:0 0 3px 4px;min-height:15px}.doc .st{border:2px solid #1e3a8a;padding:5px 6px}.doc .hd{display:flex;justify-content:space-between;align-items:baseline;font-size:11px;gap:8px}.doc .lg{font-weight:800;font-size:16px;letter-spacing:-.3px}.doc .ttl{font-weight:600;border-bottom:1px solid #1e3a8a;margin:3px 0 4px;padding-bottom:1px}.doc .ln{display:flex;gap:8px;margin:3px 0}.doc .ln>span{flex:1;display:flex;gap:4px;align-items:baseline;white-space:nowrap}.doc .u{flex:1;min-width:0;border-bottom:1px solid #1e3a8a;color:#111;font-weight:600;font-style:normal;text-align:center;min-height:15px}.doc table{width:100%;border-collapse:separate;border-spacing:3px 2px;margin:3px 0 0}.doc th{font-weight:400;text-align:center}.doc td{border-bottom:1px solid #1e3a8a;text-align:center;color:#111;font-weight:600;height:17px;padding:0}.doc th.l,.doc td.l{text-align:left;border:0;font-weight:400;color:#1e3a8a;white-space:nowrap;width:1%}.doc td.sh{text-align:left;border:0;font-weight:600;padding-top:4px}.doc .u.uf{flex:0 0 auto;min-width:18px;padding:0 3px}.doc table.dzt{margin-top:8px;border-spacing:0;table-layout:fixed}.doc .dzt th{text-align:left;font-weight:700;color:#111;font-size:9.5px;padding:0 4px 2px 0;white-space:nowrap}.doc .dzt .bu{font-weight:400;font-size:7px}.doc .dzt td{border:0;height:auto;text-align:left;vertical-align:middle;font-weight:400;font-size:10.5px;padding:1px 4px 1px 0;white-space:nowrap;overflow:hidden}.doc .dzt td.zn{font-weight:700;font-size:11.5px}.doc .dc{display:flex;gap:4px;align-items:baseline;margin:6px 0 0}.doc .dc .u{font-weight:600}.doc .nt b{font-weight:700}.doc .k{color:#111;font-weight:600}.doc .nt{color:#111;font-weight:600;margin:5px 0 0 4px;white-space:pre-wrap}';
{const st=document.createElement('style');st.textContent=DOC_CSS;document.head.appendChild(st)}
const repTitle=()=>V.dtype==='Pacemaker'||V.dtype==='CRT'?'ใบรายงานผลการเช็คเครื่องกระตุ้นหัวใจ':V.dtype==='ICD'||V.dtype==='CRT-D'?'ใบรายงานผลการเช็คเครื่องกระตุกหัวใจ':'';
const devType=()=>V.dtype==='other'?(V.dother||'Other'):(V.dtype||'');

const mrows=list=>list.map(([k,l])=>`<tr><td class="l">${RL[k]||l}</td>${C.map(c=>`<td>${gv(k+'_'+c)}</td>`).join('')}</tr>`).join('');
const colHead=c=>c+(c==='A'&&V.bbap_A?' (BBaP)':'')+(c==='RV'&&V.lbbap_RV?' (LBBaP)':'')+(c==='LV'&&V.lbbap_LV?' (LBBaP)':'');
function dzRep(){const on=dzOn();if(!on.length)return'';
  return `<table class="dzt"><colgroup><col style="width:28px"><col style="width:26px"><col style="width:50px"><col></colgroup><tr><th colspan="2">Detection</th><th>Rates<span class="bu"> bpm</span></th><th>Therapies</th></tr>${on.map(([z])=>{const t=dzRows(z);let txt=t.join(', ');

const nfTxt=()=>V.nfmode==='Month'?(V.nfmon?V.nfmon+' '+(V.nfunit==='เดือน'?'เดือน':(parseFloat(V.nfmon)===1?'month':'months')):''):(V.nextfu?fd(V.nextfu):'');
const noteTxt=()=>[V.noep?'No episode':'',V.goodp?'Good parameters':'',V.notes||''].filter(Boolean).join('\n');

<div class="st"><div class="hd"><span class="lg">Medtronic</span><span style="display:flex;gap:4px;flex:1;max-width:60%">Follow up date ${U(gdv('fu'))}</span></div>
<div class="ttl">${esc(devType()||'Pacemaker / ICD / CRT / CRT-D')} F/U</div>
<div class="ln"><span>Model ${U(gv('model'))}</span><span>DOI ${U(gdv('doi'))}</span></div>
<div class="ln"><span>Mode ${U(gv('mode'))}</span><span>Rate ${U(gv('rate'))} ppm</span></div>
<div class="ln"><span>Battery ${U(gv('batt'))} V${V.lowchk&&V.lowohm?`, <b class="k">${gv('lowohm')}</b> ohms`:''}</span><span>Est. ${V.initchk?U('Initializing'):U(gv('est'))+(V.est?' '+unitWord(V.estunit,V.est):'')}</span></div>
${(V.lowchk&&V.rrt)||(V.minchk&&V.minval)?`<div class="ln"><span>${V.lowchk&&V.rrt?`RRT ${U(gv('rrt'))} V`:''}</span><span>${V.minchk&&V.minval?`Min ${U(gv('minval'))} ${unitWord(V.minunit,V.minval)}`:''}</span></div>`:''}
<div class="ln"><span style="flex:0 0 auto">Charge time <i class="u uf">${gv('chgs')||'-'}</i> Sec @ <i class="u uf">${gv('chgj')||'-'}</i> J</span></div>
<table><tr><th class="l">Chamber</th>${C.map(c=>`<th>${colHead(c)}</th>`).join('')}</tr>${descRows(measDesc)}${lvVecRows()}<tr><td class="sh" colspan="4">Setting</td></tr>${descRows(setDesc)}</table>${dzRep()}</div>
<div class="nt"><b>Note:</b> ${esc(noteTxt())||'-'}</div><div class="nt"><b>Next follow up:</b> ${esc(nfTxt())||'-'}</div></div>`;
}
let _pt=0,_last='';

  {const m=V.nfmode==='Month';$('#nfDate').style.display=m?'none':'';$('#nfMon').style.display=m?'':'none';document.querySelectorAll('[data-set="nfmode"]').forEach(b=>b.classList.toggle('on',(m?'Month':'Date')===b.dataset.val))}

  p('Follow-up date','fu',1);L.push('');
  if(V.dtype)L.push('Type: '+devType());p('Model','model');p('DOI','doi',1);p('Mode','mode');p('Rate (ppm)','rate');p('Battery (V)','batt');

/* ---------- Auto-update (GitHub Pages / iPhone shortcut) ---------- */
(function(){
  if(!/^https?:$/.test(location.protocol))return;
  let dirty=false,busy=false,last=0;
  const mark=()=>{dirty=true};
  ['input','change'].forEach(t=>document.addEventListener(t,mark,true));
  document.addEventListener('click',e=>{if(e.target.closest&&e.target.closest('main button'))mark()},true);
  const K='fu_page_hash';
  const hash=s=>{let h=5381;for(let i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))|0;return(h>>>0).toString(36)+s.length.toString(36)};
  const get=()=>{try{return localStorage.getItem(K)}catch(e){return null}};
  const put=v=>{try{localStorage.setItem(K,v)}catch(e){}};
  const go=h=>{put(h);const u=new URL(location.href);u.searchParams.set('v',h);location.replace(u.toString())};
  function bar(h){
    if(document.getElementById('upd'))return;
    const b=document.createElement('button');b.id='upd';b.type='button';
    b.style.cssText='position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:50;background:var(--ac);color:var(--acx);border:0;border-radius:12px;padding:14px;font-weight:700;box-shadow:0 4px 16px rgba(0,0,0,.35)';
    b.textContent='New version available — tap to update';
    b.onclick=()=>go(h);document.body.appendChild(b);
  }
  async function check(){
    if(busy||Date.now()-last<30000)return;busy=true;last=Date.now();
    try{
      const u=new URL(location.href);u.searchParams.delete('v');u.searchParams.set('_',Date.now());u.hash='';
      const r=await fetch(u.toString(),{cache:'no-store'});
      if(!r.ok)return;
      const h=hash(await r.text()),old=get();
      if(!old){put(h);return}
      if(old===h)return;
      if(dirty)bar(h);else go(h);
    }catch(e){}finally{busy=false}
  }
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')check()});
  window.addEventListener('pageshow',e=>{if(e.persisted)check()});
  setTimeout(check,2500);
})();
