.lan{position:absolute;display:block;border-radius:45% 45% 22% 22%/60% 60% 22% 22%;background:linear-gradient(180deg,#ffe6a8,#ffa23f 85%);box-shadow:0 0 9px 3px rgba(255,166,60,.55)}

.lkfx .kt{position:absolute;left:0;will-change:transform;animation:lkdrift linear infinite}
.lkfx .kt i{display:block;animation:lkbob ease-in-out infinite alternate}
.lkfx .kt svg{display:block;width:100%;height:auto;filter:drop-shadow(0 0 4px rgba(255,190,90,.55))}
.lkfx .kt .fl{transform-box:fill-box;transform-origin:50% 100%;animation:lkflick .9s ease-in-out infinite alternate}
@keyframes lkdrift{from{transform:translate3d(-48px,0,0)}to{transform:translate3d(calc(100vw + 8px),0,0)}}
@keyframes lkbob{from{transform:translate3d(0,-1.5px,0) rotate(-3deg)}to{transform:translate3d(0,1.5px,0) rotate(3deg)}}

#lants{display:none;position:fixed;left:0;top:0;width:100%;height:100%;pointer-events:none;overflow:hidden;z-index:4}

}

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const V={};
const pt=[['name','Name','full'],['hn','HN'],['fu','Follow-up date','date'],['admit','Admit'],['hosp','Hospital']];
const dev=[['model','Model'],['doi','DOI (implant date)','date'],['mode','Mode'],['rate','Rate','','ppm','text']];
const DZ=[['VF','VF'],['FVT','FVT'],['VT','VT'],['VTM','VT Monitor']];
const RXN=6,RXT=['J','ATP'],ATP=['Burst','Ramp','Ramp+','iATP'];
const setK=(k,v)=>{V[k]=v;const el=document.querySelector(`[data-k="${k}"]`);if(el)el.value=v};
const seg=(k,opts)=>`<div class="seg">${opts.map(o=>`<button type="button" data-set="${k}" data-val="${o}">${o}</button>`).join('')}</div>`;
const rxTxt=(z,i)=>{const t=V[`dzt_${z}_${i}`]||'',a=V[`dza_${z}_${i}`]||'',v=V[`dzv_${z}_${i}`]||'';if(!t&&!v)return'';
  if(t==='J')return v?v+'J':'J';if(t==='ATP'){const n=a||'ATP';return v?`${n}(${v})`:n}return v};
const dzOn=()=>DZ.filter(([z])=>V['dz_'+z]);
function dzRows(z){if(z==='VTM')return[];const o=[];for(let i=1;i<=RXN;i++){const t=rxTxt(z,i);if(t)o.push(t)}return o}
const C=['A','RV','LV'];
const RL={pace:'Pacing(%)',sense:'Sensing(mV)',imp:'Impedance(Ω)',defib:'ICD Defib/SVC',thr:'Threshold(V)',thrms:'at(ms)',thr2:'Threshold 2(V)',thrms2:'at 2(ms)',amp:'Amplitude(V)',pw:'Pulse width(ms)',sens:'Sensitivity(mV)'};
const meas=[['pace','Pacing (%)'],['sense','Sensing (mV)'],['imp','Impedance (Ω)'],['defib','ICD Defib/SVC (Ω)'],['thr','Threshold (V)'],['thrms','at (ms)']];
const meas2=[['thr2','Threshold 2 (V)'],['thrms2','at 2 (ms)']];
const set=[['amp','Amplitude (V)'],['pw','Pulse width (ms)'],['sens','Sensitivity (mV)']];
const measDesc=meas.map(([k,l])=>({k,l:RL[k]||l,get:c=>{
  let v=V[k+'_'+c]||'';
  if(k==='defib'&&c==='RV'){const v2=V.defib2_RV||'';if(v2)v=v?v+'/'+v2:v2}
  if(V.thr2chk){const k2=k==='thr'?'thr2':k==='thrms'?'thrms2':null;if(k2){const v2=V[k2+'_'+c]||'';if(v2)v=v?v+'/'+v2:v2}}
  return v;
}}));
const setDesc=set.map(([k,l])=>({k,l:RL[k]||l,get:c=>V[k+'_'+c]||''}));
const cellFs=v=>{const n=String(v||'').length;return n>8?Math.max(7,Math.min(12,Math.round(62/(n*0.6)*10)/10)):0};
const descRows=desc=>desc.map(d=>`<tr><td class="l">${d.l}</td>${C.map(c=>{const v=d.get(c),f=cellFs(v);return `<td${f?` style="font-size:${f}px;white-space:nowrap"`:''}>${v?esc(v):'-'}</td>`}).join('')}</tr>`).join('');
const VEC_TPL={'LV to LV':'LV{1} to LV{2}','LV to RVcoil':'LV{1} to RVcoil'};
const VEC_BLANKS={'LV to LV':2,'LV to RVcoil':1};
function lvVecText(){const opt=V.lvvecopt||'';if(!opt)return'';const tpl=VEC_TPL[opt];if(!tpl)return opt;return tpl.replace('{1}',gv('lvvecn1')||'_').replace('{2}',gv('lvvecn2')||'_')}
function unitWord(u,val){const n=parseFloat(String(val||'').replace(/[<>]/g,''));const isMonth=u==='Months';if(isMonth)return n===1?'month':'months';return n===1?'year':'years'}
const lvLine=t=>`<tr><td colspan="4" style="border:0;text-align:right;font-weight:400;font-size:10px;height:auto;padding:0 3px 1px 0;white-space:nowrap">${t}</td></tr>`;
function lvVecRows(){
  if(!V.lvvecchk)return'';
  const vt=lvVecText();
  const timing=V.lvvecopt!=='LVtip to LVring'&&(V.vvdir||V.vvms)?(esc(V.vvdir||'LV→RV')+' '+gv('vvms')+' ms'):'';
  return (vt?lvLine(vt):'')+(timing?lvLine(timing):'');
}
const fld=([k,l,t,u,im])=>`<div${t==='full'?' class="full"':''}><label>${l}</label>${u?`<div class="ui"><input data-k="${k}"${im?` inputmode="${im}"`:''}><b>${u}</b></div>`:`<input data-k="${k}" type="${t&&t!=='full'?t:'text'}"${im?` inputmode="${im}"`:''}>`}</div>`;

/* ---------- Auto-update (GitHub Pages / iPhone shortcut) + release notes ---------- */
(function(){
  const NK='fu_notes_seen';
  const lsGet=k=>{try{return localStorage.getItem(k)}catch(e){return null}};
  const lsSet=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};

  function card(title,notes,btns){
    const old=document.getElementById('upd');if(old)old.remove();
    const d=document.createElement('div');d.id='upd';d.setAttribute('role','dialog');d.style.cssText=css;
    const items=notes&&notes.items&&notes.items.length?'<ul style="margin:8px 0 12px;padding-left:20px">'+notes.items.map(s=>'<li style="margin:3px 0">'+fmt(s)+'</li>').join('')+'</ul>':'<div style="height:10px"></div>';
    d.innerHTML='<div style="font-weight:800;font-size:16px;color:var(--ac)">'+esc(title)+'</div>'+items+'<div style="display:flex;gap:8px"></div>';
    const row=d.lastChild;btns.forEach(([t,fn,p])=>{const b=document.createElement('button');b.type='button';b.textContent=t;b.style.flex='1';if(p)b.className='p';b.onclick=()=>{d.remove();fn&&fn()};row.appendChild(b)});
    document.body.appendChild(d);
  }
  // show "What's new" once after an update
  const mine=parseNotes(document.documentElement.outerHTML);
  if(mine&&mine.id&&lsGet(NK)!==mine.id){
    const seenBefore=lsGet(NK)!==null||lsGet('fu_page_hash')!==null;
    lsSet(NK,mine.id);
    if(seenBefore)setTimeout(()=>card("What's new — "+(document.documentElement.dataset.ver||''),mine,[['OK',null,1]]),900);
  }
  if(!/^https?:$/.test(location.protocol))return;
  let busy=false,last=0;
  const K='fu_page_hash';
  const hash=s=>{let h=5381;for(let i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))|0;return(h>>>0).toString(36)+s.length.toString(36)};
  const go=h=>{lsSet(K,h);const u=new URL(location.href);u.searchParams.set('v',h);location.replace(u.toString())};
  async function check(){
    if(busy||Date.now()-last<30000)return;busy=true;last=Date.now();
    try{
      const u=new URL(location.href);u.searchParams.delete('v');u.searchParams.set('_',Date.now());u.hash='';
      const r=await fetch(u.toString(),{cache:'no-store'});
      if(!r.ok)return;
      const txt=await r.text(),h=hash(txt),old=lsGet(K);
      if(!old){lsSet(K,h);return}
      if(old===h)return;
      card('New version available',parseNotes(txt),[['Later',null],['Update',()=>go(h),1]]);
    }catch(e){}finally{busy=false}
  }
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')check()});
  window.addEventListener('pageshow',e=>{if(e.persisted)check()});
  setTimeout(check,2500);
})();
